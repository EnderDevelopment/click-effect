plugins {
    id 'net.minecraftforge.gradle' version '2.3.3'
}

group = project.maven_group
version = project.mod_version
archivesBaseName = project.archives_base_name

repositories {
    mavenCentral()
    maven {
        name = 'forge'
        url = "https://files.minecraftforge.net/maven"
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.loader_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft_version
    inputs.property "group", project.maven_group
}

jar {
    manifest {
        attributes(
            'FMLCorePlugin': 'com.example.inventoryeffects.asm.InventoryEffectsCorePlugin',
            'FMLCorePluginContainsFMLMod': 'true'
        )
    }
}